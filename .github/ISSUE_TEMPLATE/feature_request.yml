name: Feature request
description: Suggest an editor or Drive integration improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or editing problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe desired behavior, Markdown syntax, or Drive interaction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or alternatives exist?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links or redacted screenshots.
