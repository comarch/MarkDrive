name: Bug report
description: Report a reproducible project defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include Google OAuth secrets, tokens, cookies, private document URLs, personal data,
        or private Workspace logs.
  - type: input
    id: version
    attributes:
      label: Project version
      description: Release tag, package version, or commit SHA.
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser (Chrome, Firefox, Safari), Google Workspace or local mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal markdown snippet or steps to reproduce.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Browser console errors (redact any client IDs or tokens).
      render: shell
